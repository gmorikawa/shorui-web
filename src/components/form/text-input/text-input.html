@if (label()) {
<label [for]="property()">
  {{ label() }}
</label>
}

<input base-input
  type="text"
  [value]="value()"
  [id]="property()"
  [disabled]="isDisabled()"
  [placeholder]="placeholder()"
  [autofocus]="autofocus()"
  (input)="handleChange($event)"
  (blur)="blur.emit($event)"
  (focus)="focus.emit($event)"
  [class.error]="error()"
  [class.success]="!error()"
/>
