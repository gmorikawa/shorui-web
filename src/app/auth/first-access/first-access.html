<main class="first-access-page">
  <section class="first-access-card" aria-labelledby="first-access-title">
    <div class="first-access-card__heading">
      <span class="first-access-card__eyebrow">System setup</span>
      <h1 id="first-access-title">Create the first user</h1>
      <p>Set up the administrator account to start using the system.</p>
    </div>

    <form class="first-access-form" [formGroup]="firstAccessForm" (ngSubmit)="submit()">
      <div class="first-access-form__field">
        <label for="name">Name</label>
        <input
          id="name"
          formControlName="name"
          type="text"
          autocomplete="name"
          placeholder="Enter your name"
          [attr.aria-invalid]="firstAccessForm.controls.name.invalid && firstAccessForm.controls.name.touched"
        />
      </div>

      <div class="first-access-form__field">
        <label for="email">Email address</label>
        <input
          id="email"
          formControlName="email"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
          [attr.aria-invalid]="firstAccessForm.controls.email.invalid && firstAccessForm.controls.email.touched"
        />
      </div>

      <div class="first-access-form__field">
        <label for="password">Password</label>
        <input
          id="password"
          formControlName="password"
          type="password"
          autocomplete="new-password"
          placeholder="Create a password"
          [attr.aria-invalid]="firstAccessForm.controls.password.invalid && firstAccessForm.controls.password.touched"
        />
      </div>

      <button type="submit" [disabled]="firstAccessForm.invalid">Setup</button>
    </form>
  </section>
</main>
