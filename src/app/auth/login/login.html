<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="submit()">
      <div class="login-form__field">
        <label for="email">Email address</label>
        <input
          id="email"
          formControlName="email"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
          [attr.aria-invalid]="loginForm.controls.email.invalid && loginForm.controls.email.touched"
        />
      </div>

      <div class="login-form__field">
        <div class="login-form__label-row">
          <label for="password">Password</label>
          <a href="/auth/forgot-password">Forgot password?</a>
        </div>
        <input
          id="password"
          formControlName="password"
          type="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          [attr.aria-invalid]="loginForm.controls.password.invalid && loginForm.controls.password.touched"
        />
      </div>

      <label class="login-form__remember">
        <input formControlName="remember" type="checkbox" />
        <span>Remember me</span>
      </label>

      <button type="submit" [disabled]="loginForm.invalid">Sign in</button>
    </form>
  </section>
</main>
