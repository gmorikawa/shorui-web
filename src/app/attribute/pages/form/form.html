<card-container>
  <header>
    <h1>{{ pageTitle }}</h1>
  </header>

  <main>
    <form [formGroup]="attributeForm" (ngSubmit)="submit()">
      <sh-text-input
        property="key"
        label="Key"
        placeholder="Enter key"
        formControlName="key"
      />

      <sh-text-input
        property="label"
        label="Label"
        placeholder="Enter label"
        formControlName="label"
      />

      <sh-text-input
        property="description"
        label="Description"
        placeholder="Enter description"
        formControlName="description"
      />

      <button base-button type="submit" [disabled]="attributeForm.invalid">
        {{ submitButtonLabel }}
      </button>

      <button base-button type="button" (click)="cancel()">
        Cancel
      </button>
    </form>
  </main>
</card-container>
