<card-container>
  <header>
    <h1>
      {{ pageTitle }}
    </h1>
  </header>

  <main>
    <form [formGroup]="userForm" (ngSubmit)="submit()">
      <sh-text-input
        property="name"
        label="Full Name"
        placeholder="Clark Kent"
        formControlName="name"
      />

      <sh-email-input
        property="email"
        label="Email Address"
        placeholder="illuminate@example.com"
        formControlName="email"
      />

      @if (isEdit) {
        <sh-password-input
          property="currentPassword"
          label="Current Password"
          placeholder="******"
          formControlName="currentPassword"
        />
      } @else {
        <sh-password-input
          property="password"
          label="Password"
          placeholder="******"
          formControlName="password"
        />
      }

      <button base-button type="submit" [disabled]="userForm.invalid">
        {{ submitButtonLabel }}
      </button>

      <button base-button type="button" (click)="cancel()">
        Cancel
      </button>
    </form>
  </main>
</card-container>
