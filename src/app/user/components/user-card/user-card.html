<card-container>
  <header>
    <div>
      <p class="title">
        {{ user()?.name }}
      </p>
      <p class="subtitle">
        {{ user()?.email }}
      </p>
    </div>

    <div>
      <span class="badge">
        {{ user()?.role }}
      </span>
    </div>
  </header>

  <footer>
    @for (action of actions(); track $index) {
      <button base-button (click)="action.callback(user()!)">
        {{ action.label }}
      </button>
    }
  </footer>
</card-container>
