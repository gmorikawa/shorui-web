<card-container>
  <header>
    <header>
      <span class="card-eyebrow">{{ document()?.type?.name }}</span>
      <h1 class="card-title">{{ document()?.title }}</h1>
      <p class="card-description">{{ document()?.description }}</p>
    </header>
  </header>

  <footer>
    @for (action of actions(); track $index) {
      <button base-button (click)="action.callback(document()!)">
        {{ action.label }}
      </button>
    }
  </footer>
</card-container>
