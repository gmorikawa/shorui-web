<card-container>
  <header>
    <div>
      <p class="title">
        {{ documentType()?.name }}
      </p>
      <p class="subtitle">
        {{ documentType()?.description }}
      </p>
    </div>
  </header>

  <footer>
    @for (action of actions(); track $index) {
      <button base-button (click)="action.callback(documentType()!)">
        {{ action.label }}
      </button>
    }
  </footer>
</card-container>
