<card-container>
  <h1>Register Document Type</h1>

  <form [formGroup]="documentTypeForm" (ngSubmit)="submit()">
    <sh-text-input
      property="name"
      label="Name"
      placeholder="Enter name"
      formControlName="name"
    />

    <sh-text-input
      property="description"
      label="Description"
      placeholder="Enter description"
      formControlName="description"
    />

    <sh-checkbox-input
      property="attributes"
      label="Attributes"
      [options]="($attributes | async) ?? []"
      [getKey]="getAttributeKey"
      [getLabel]="getAttributeLabel"
      formControlName="attributes"
    />

    <button base-button type="submit" [disabled]="documentTypeForm.invalid">
      Register
    </button>
  </form>
</card-container>
