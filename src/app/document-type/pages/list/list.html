<sh-stack>
  <div>
    <button base-button type="button" (click)="navigateToForm()">
      Create
    </button>
  </div>

  @for (documentType of documentTypes(); track documentType.id) {
  <sh-document-type-card
    [documentType]="documentType"
    [actions]="[
      { label: 'Edit', callback: navigateToForm.bind(this) }
    ]"
  />
  }
</sh-stack>
